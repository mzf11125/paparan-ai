[project]
name = "paparan-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.2",
  "langgraph-sdk>=0.1",
  "deepagents>=0.1",
  "langmem>=0.0.15",
  "langchain>=0.3",
  "langchain-anthropic>=0.3",
  "langchain-community>=0.3",
  "langchain-openai>=0.2",
  "langchain-postgres>=0.0.12",
  "langchain-text-splitters>=0.3",
  "tavily-python>=0.5",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "supabase>=2.10",
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
  "markdownify>=0.13",
  "bs4>=0.0.2",
  "pypdf>=5.0",
  "pyjwt>=2.9",
  "reportlab==4.2.5",
  "python-pptx==1.0.2",
  "python-dotenv>=1.0",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*", "scripts*", "supabase*"]
