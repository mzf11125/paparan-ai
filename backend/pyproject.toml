[project]
name = "paparan-backend"
version = "0.1.0"
description = "Paparan AI Backend - ASEAN Policy Intelligence Multi-Agent System"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  # LangGraph & Agents
  "langgraph>=0.2",
  "langgraph-sdk>=0.1",
  "deepagents>=0.1",
  "langmem>=0.0.15",

  # LangChain Ecosystem
  "langchain>=0.3",
  "langchain-anthropic>=0.3",
  "langchain-community>=0.3",
  "langchain-postgres>=0.0.12",
  "langchain-text-splitters>=0.3",

  # Search & Scraping
  "tavily-python>=0.5",
  "httpx>=0.27",
  "markdownify>=0.13",
  "bs4>=0.0.2",
  "beautifulsoup4>=4.12",

  # Document Processing
  "pypdf>=5.0",
  "reportlab==4.2.5",
  "python-pptx==1.0.2",
  "python-docx>=1.1",

  # API Framework
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.12",

  # Database
  "supabase>=2.10",
  "psycopg[binary]>=3.2",
  "sqlalchemy>=2.0",

  # Configuration & Utilities
  "python-dotenv>=1.0",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "pyyaml>=6.0",

  # Observability
  "langsmith>=0.1",

  # Task Queue (for background jobs)
  "celery>=5.3",
  "redis>=5.0",

  # HTTP Client
  "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "black>=24.0",
  "ruff>=0.6",
  "mypy>=1.10",
  "pre-commit>=3.0",
]

[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
